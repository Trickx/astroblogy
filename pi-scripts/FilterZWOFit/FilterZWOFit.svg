<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-label="FilterZWOFit icon">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#081423"/>
      <stop offset="100%" stop-color="#163453"/>
    </linearGradient>
    <radialGradient id="glass" cx="40%" cy="35%" r="70%">
      <stop offset="0%" stop-color="#8de6ff" stop-opacity="0.95"/>
      <stop offset="45%" stop-color="#3ea4ff" stop-opacity="0.88"/>
      <stop offset="100%" stop-color="#2f4df5" stop-opacity="0.82"/>
    </radialGradient>
    <radialGradient id="glassReflect" cx="42%" cy="38%" r="48%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.42"/>
      <stop offset="60%" stop-color="#cfe9ff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#f5f7fa"/>
      <stop offset="35%" stop-color="#b0b9c5"/>
      <stop offset="65%" stop-color="#6f7b88"/>
      <stop offset="100%" stop-color="#d9e0e8"/>
    </linearGradient>
    <linearGradient id="metalDark" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#516070"/>
      <stop offset="100%" stop-color="#2f3b47"/>
    </linearGradient>
    <filter id="softShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="4" stdDeviation="3" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <rect x="8" y="8" width="112" height="112" rx="18" fill="url(#bg)"/>

  <g filter="url(#softShadow)">
    <circle cx="64" cy="64" r="45" fill="url(#metalDark)"/>
    <circle cx="64" cy="64" r="39" fill="none" stroke="url(#metal)" stroke-width="11"/>

    <circle cx="64" cy="64" r="30" fill="url(#glass)" stroke="#b5d8ff" stroke-width="2.2"/>
    <ellipse cx="56" cy="59" rx="13" ry="9" fill="url(#glassReflect)" transform="rotate(-18 56 59)"/>
  </g>
</svg>
