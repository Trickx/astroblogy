    <stop offset="0%" stop-color="#ffffff"/>
    <stop offset="35%" stop-color="#fff1d6" stop-opacity="0.95"/>
    <stop offset="100%" stop-color="#ffd9a0" stop-opacity="0"/>
  </radialGradient>
  <marker id="ComastarARR" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
    <path d="M0,0 L10,5 L0,10 z" fill="#a8b6c8"/></marker>
  <marker id="ComastarARRB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
