    <path d="M0,0 L10,5 L0,10 z" fill="#82e0aa"/></marker>
</defs><rect width="640" height="250" rx="10" fill="#0c141d"/><ellipse cx="230.0" cy="125" rx="22.0" ry="20.0" fill="url(#ComastarSTAR)" opacity="0.55"/><ellipse cx="239.2" cy="125" rx="26.3" ry="22.0" fill="url(#ComastarSTAR)" opacity="0.49"/><ellipse cx="248.3" cy="125" rx="30.7" ry="24.0" fill="url(#ComastarSTAR)" opacity="0.43"/><ellipse cx="257.5" cy="125" rx="35.0" ry="26.0" fill="url(#ComastarSTAR)" opacity="0.37"/><ellipse cx="266.7" cy="125" rx="39.3" ry="28.0" fill="url(#ComastarSTAR)" opacity="0.31"/><ellipse cx="275.8" cy="125" rx="43.7" ry="30.0" fill="url(#ComastarSTAR)" opacity="0.25"/><ellipse cx="285.0" cy="125" rx="48.0" ry="32.0" fill="url(#ComastarSTAR)" opacity="0.19"/><circle cx="230.0" cy="125.0" r="26.0" fill="url(#ComastarSTAR)"/><circle cx="230" cy="125" r="4" fill="#64c7ff"/><text x="218.0" y="87.0" font-size="12" fill="#64c7ff" text-anchor="end" font-weight="normal">Fit-Zentrum (symm. Modell)</text><circle cx="246" cy="125" r="4" fill="#ffab5e"/><line x1="230.0" y1="185.0" x2="246.0" y2="185.0" stroke="#ffab5e" stroke-width="2" marker-end="url(#ComastarARRO)"/><text x="252.0" y="189.0" font-size="12" fill="#ffab5e" text-anchor="start" font-weight="normal">Schwerpunktversatz</text><line x1="230.0" y1="215.0" x2="290.0" y2="215.0" stroke="#ffab5e" stroke-width="2.5" marker-end="url(#ComastarARRO)"/><text x="296.0" y="219.0" font-size="12" fill="#ffab5e" text-anchor="start" font-weight="normal">drittes Moment m₃ (gewichtet den Ausläufer)</text><text x="430.0" y="60.0" font-size="13" fill="#a8b6c8" text-anchor="start" font-weight="normal">Gauß und Moffat sind</text><text x="430.0" y="78.0" font-size="13" fill="#a8b6c8" text-anchor="start" font-weight="normal">punktsymmetrisch: Sie erkennen</text><text x="430.0" y="96.0" font-size="13" fill="#a8b6c8" text-anchor="start" font-weight="normal">nicht, wo der Ausläufer liegt.</text><text x="430.0" y="124.0" font-size="13" fill="#e7edf5" text-anchor="start" font-weight="normal">Die Pixel schon:</text><text x="430.0" y="146.0" font-size="15" fill="#ffab5e" text-anchor="start" font-weight="bold">m₃ = Σ w·ρ²·ρ / Σ w</text><text x="430.0" y="166.0" font-size="13" fill="#a8b6c8" text-anchor="start" font-weight="normal">ρ = Abstand / σ</text></svg>
