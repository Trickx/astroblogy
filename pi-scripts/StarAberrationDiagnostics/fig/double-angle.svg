</defs><rect width="640" height="250" rx="10" fill="#0c141d"/><text x="160.0" y="30.0" font-size="15" fill="#e7edf5" text-anchor="middle" font-weight="bold">naive mean of the angles</text><line x1="91.1" y1="137.2" x2="228.9" y2="112.8" stroke="#64c7ff" stroke-width="3"/><line x1="228.9" y1="137.2" x2="91.1" y2="112.8" stroke="#64c7ff" stroke-width="3"/><line x1="160.0" y1="195.0" x2="160.0" y2="55.0" stroke="#ff7b7b" stroke-width="3" stroke-dasharray="6 5"/><text x="160.0" y="215.0" font-size="15" fill="#ff7b7b" text-anchor="middle" font-weight="normal">(10° + 170°) / 2 = 90°  ✗</text><text x="480.0" y="30.0" font-size="15" fill="#e7edf5" text-anchor="middle" font-weight="bold">double-angle mean</text><line x1="411.1" y1="137.2" x2="548.9" y2="112.8" stroke="#64c7ff" stroke-width="3"/><line x1="548.9" y1="137.2" x2="411.1" y2="112.8" stroke="#64c7ff" stroke-width="3"/><line x1="395.0" y1="125.0" x2="565.0" y2="125.0" stroke="#82e0aa" stroke-width="3" stroke-dasharray="6 5"/><text x="480.0" y="205.0" font-size="14" fill="#82e0aa" text-anchor="middle" font-weight="normal">20° and 340° → vector mean 0° → half: 0°  ✓</text><text x="480.0" y="228.0" font-size="13" fill="#a8b6c8" text-anchor="middle" font-weight="normal">(cos 2ψ, sin 2ψ) are averaged, then halved</text><line x1="320.0" y1="20.0" x2="320.0" y2="230.0" stroke="#2a3b4f" stroke-width="1"/></svg>
