</defs><rect width="640" height="250" rx="10" fill="#0c141d"/><circle cx="130.0" cy="190.0" r="7.0" fill="url(#RadialelliptSTAR)"/><text x="130.0" y="216.0" font-size="12" fill="#a8b6c8" text-anchor="middle" font-weight="normal">image center</text><line x1="130.0" y1="190.0" x2="420.0" y2="80.0" stroke="#a8b6c8" stroke-width="1.3" stroke-dasharray="5 4"/><line x1="420.0" y1="80.0" x2="522.8" y2="41.0" stroke="#a8b6c8" stroke-width="1.2" marker-end="url(#RadialelliptARR)"/><text x="530.3" y="54.2" font-size="12" fill="#a8b6c8" text-anchor="start" font-weight="normal">radial direction φ</text><ellipse cx="420.0" cy="80.0" rx="34.0" ry="16.0" fill="url(#RadialelliptSTAR)" transform="rotate(-55.8 420.0 80.0)"/><ellipse cx="420.0" cy="80.0" rx="21.1" ry="9.9" fill="none" stroke="#64c7ff" stroke-width="1.4" transform="rotate(-55.8 420.0 80.0)"/><line x1="420.0" y1="80.0" x2="459.4" y2="22.1" stroke="#64c7ff" stroke-width="2" marker-end="url(#RadialelliptARRB)"/><text x="462.7" y="17.2" font-size="12" fill="#64c7ff" text-anchor="start" font-weight="normal">major axis ψ</text><text x="40.0" y="40.0" font-size="17" fill="#ffab5e" text-anchor="start" font-weight="bold">eps_rad = ε · cos 2(ψ − φ)</text><text x="40.0" y="64.0" font-size="13" fill="#a8b6c8" text-anchor="start" font-weight="normal">+ε: along the radius · −ε: across it · 0: at 45°</text></svg>
